name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/watchparty
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hambin
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: hambin_watchparty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hambin -d hambin_watchparty"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hambin:local-development-only@127.0.0.1:5432/hambin_watchparty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: backend/watchparty/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - run: npm run test:integration
